# ==============================================================================
# Publish Fekra V2 / Doable Docker images
# ==============================================================================
# Durable images go to GHCR. Bootstrap branch builds also publish an anonymous
# 24-hour ttl.sh copy so Railway smoke tests do not depend on GHCR package
# visibility or registry credentials.
# ==============================================================================

name: Publish Docker images

on:
  push:
    branches:
      - fekra-v2-bootstrap
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/doable
  SMOKE_PREFIX: ttl.sh/fekra-v2-c7d4a81e

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [api, ws, web, migrate]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          IMAGE="${IMAGE_PREFIX}-${{ matrix.target }}"
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
            echo "tags=${IMAGE}:${VERSION},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
            echo "Building ${IMAGE}:${VERSION} (+ :latest)"
          else
            SMOKE_IMAGE="${SMOKE_PREFIX}-${{ matrix.target }}:24h"
            echo "tags=${IMAGE}:latest,${SMOKE_IMAGE}" >> "$GITHUB_OUTPUT"
            echo "Building ${IMAGE}:latest + ${SMOKE_IMAGE}"
          fi

      - name: Build and push ${{ matrix.target }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/docker/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          provenance: false
