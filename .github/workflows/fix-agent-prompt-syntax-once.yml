name: Fix agent prompt syntax once

on:
  push:
    branches:
      - fekra-v2-bootstrap
    paths:
      - .github/workflows/fix-agent-prompt-syntax-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fekra-v2-bootstrap
      - name: Escape tool name inside template literal
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('services/api/src/routes/chat/system-prompts.ts')
          s = p.read_text()
          old = '`create_files`'
          new = '\\`create_files\\`'
          count = s.count(old)
          if count != 2:
              raise SystemExit(f'expected 2 unescaped create_files markers, found {count}')
          p.write_text(s.replace(old, new))
          PY
          git diff --check
          sed -n '186,198p' services/api/src/routes/chat/system-prompts.ts
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "fekra-v2-bot"
          git config user.email "actions@users.noreply.github.com"
          git add services/api/src/routes/chat/system-prompts.ts
          git commit -m "fix(agent): escape batch tool name in prompt literal"
          git push origin HEAD:fekra-v2-bootstrap
