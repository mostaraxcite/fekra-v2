name: Fix agent stall once

on:
  push:
    branches:
      - fekra-v2-bootstrap
    paths:
      - .github/workflows/fix-agent-stall-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fekra-v2-bootstrap

      - name: Patch agent generation reliability and latency
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"expected block not found in {path}: {old[:100]!r}")
              if s.count(old) != 1:
                  raise SystemExit(f"expected exactly one match in {path}, got {s.count(old)}")
              p.write_text(s.replace(old, new, 1))

          # 1) Normalize nested tool failures once and reuse everywhere.
          tm = 'services/api/src/ai/tool-messages.ts'
          marker = '''/**
           * Generate a creator-friendly result message for a completed tool operation.
           * Strips server paths and technical details, keeps it engaging.
           */
          export function friendlyToolResult('''
          helper = '''/**
           * Resolve the real outcome of a tool call. Some SDK providers report
           * top-level success=true even when the custom tool returned
           * { success: false, error: ... }. Nested failure always wins.
           */
          export function inferToolSuccess(result?: unknown, explicitSuccess?: unknown): boolean {
            const inspect = (value: unknown, depth: number): boolean | undefined => {
              if (depth < 0 || value == null) return undefined;
              if (typeof value === "string") {
                const t = value.trim();
                if (t.startsWith("{") && t.endsWith("}") && t.length < 200_000) {
                  try { return inspect(JSON.parse(t), depth - 1); } catch { /* plain text result */ }
                }
                return undefined;
              }
              if (typeof value !== "object") return undefined;
              const r = value as Record<string, unknown>;
              if (r.success === false || r.ok === false || r.isError === true) return false;
              if (typeof r.error === "string" && r.error.trim() && r.success !== true) return false;
              for (const key of ["result", "output", "data"]) {
                if (key in r) {
                  const nested = inspect(r[key], depth - 1);
                  if (nested === false) return false;
                }
              }
              if (r.success === true || r.ok === true) return true;
              return undefined;
            };
            if (explicitSuccess === false) return false;
            const nested = inspect(result, 3);
            if (nested === false) return false;
            if (explicitSuccess === true) return true;
            return nested !== false;
          }

          /**
           * Generate a creator-friendly result message for a completed tool operation.
           * Strips server paths and technical details, keeps it engaging.
           */
          export function friendlyToolResult('''
          replace_once(tm, marker, helper)
          replace_once(tm, '  const ok = success !== false;\n', '  const ok = inferToolSuccess(result, success);\n')
          replace_once(tm,
              '  result = result.replace(/<\\/?answer>/gi, "");\n',
              '  result = result.replace(/<\\/?answer>/gi, "");\n  // DeepSeek V3.2/V4 can leak raw DSML protocol tags when provider-side\n  // tool parsing fails. Never expose internal tool-call markup to users.\n  result = result.replace(/<\\/?[|｜]DSML[|｜](?:function_calls|tool_calls|invoke|parameter)\\b[^>\\n]*(?:>|(?=\\n))/gi, "");\n')

          # 2) SSE mapper: nested failure wins + suppress DSML blocks statefully.
          sm = 'services/api/src/ai/sse-mapper.ts'
          replace_once(sm,
              'import { sanitizeText, stripServerPaths, friendlyToolResult } from "./tool-messages.js";',
              'import { sanitizeText, stripServerPaths, friendlyToolResult, inferToolSuccess } from "./tool-messages.js";')
          replace_once(sm,
              '  /** True when we\'re inside a tool call block */\n  private inTool = false;\n',
              '  /** True when we\'re inside a tool call block */\n  private inTool = false;\n  /** True while suppressing leaked DeepSeek DSML tool protocol. */\n  private inDsmlTool = false;\n')
          replace_once(sm,
              '  private static TOOL_OPEN_RE = /<function\\b[^>]*>/i;\n  private static TOOL_CLOSE_RE = /<\\/function>/i;\n\n  private static PARTIAL_MARKER_RE = /<(?:\\/?[a-z|!]*|\\|?[a-z|]*)$/i;\n',
              '  private static TOOL_OPEN_RE = /<function\\b[^>]*>/i;\n  private static TOOL_CLOSE_RE = /<\\/function>/i;\n  private static DSML_OPEN_RE = /<[|｜]DSML[|｜](?:function_calls|tool_calls)\\b[^>\\n]*>?/i;\n  private static DSML_CLOSE_RE = /<\\/[|｜]DSML[|｜](?:function_calls|tool_calls)\\s*>/i;\n\n  // Includes the full-width pipe used by DeepSeek DSML plus underscores,\n  // so split protocol markers are buffered instead of leaking token-by-token.\n  private static PARTIAL_MARKER_RE = /<(?:\\/?[a-z0-9_|｜!:\\-]*|[|｜]?[a-z0-9_|｜!:\\-]*)$/i;\n')
          replace_once(sm,
              '    while (remaining.length > 0) {\n      if (this.inThinking) {\n',
              '    while (remaining.length > 0) {\n      if (this.inDsmlTool) {\n        const closeIdx = remaining.search(ChannelTokenRouter.DSML_CLOSE_RE);\n        if (closeIdx === -1) {\n          // Discard DSML body. Preserve only a trailing partial marker so a\n          // split closing token can be recognized on the next delta.\n          const trailing = remaining.match(ChannelTokenRouter.PARTIAL_MARKER_RE);\n          this.buffer = trailing?.[0] ?? "";\n          remaining = "";\n        } else {\n          const match = remaining.slice(closeIdx).match(ChannelTokenRouter.DSML_CLOSE_RE);\n          remaining = remaining.slice(closeIdx + (match ? match[0].length : 1));\n          if (remaining.startsWith("\\n")) remaining = remaining.slice(1);\n          this.inDsmlTool = false;\n        }\n      } else if (this.inThinking) {\n')
          replace_once(sm,
              '        const thinkOpenIdx = remaining.search(ChannelTokenRouter.THINK_OPEN_RE);\n        const toolOpenIdx = remaining.search(ChannelTokenRouter.TOOL_OPEN_RE);\n        const thinkOrphanCloseIdx = remaining.search(ChannelTokenRouter.THINK_CLOSE_RE);\n\n        // Priority 1: Tool Open\n        if (toolOpenIdx !== -1 && (thinkOpenIdx === -1 || toolOpenIdx < thinkOpenIdx)) {\n',
              '        const thinkOpenIdx = remaining.search(ChannelTokenRouter.THINK_OPEN_RE);\n        const toolOpenIdx = remaining.search(ChannelTokenRouter.TOOL_OPEN_RE);\n        const dsmlOpenIdx = remaining.search(ChannelTokenRouter.DSML_OPEN_RE);\n        const thinkOrphanCloseIdx = remaining.search(ChannelTokenRouter.THINK_CLOSE_RE);\n\n        // Priority 0: leaked DeepSeek DSML is internal protocol, never UI text.\n        if (dsmlOpenIdx !== -1 && (thinkOpenIdx === -1 || dsmlOpenIdx < thinkOpenIdx) && (toolOpenIdx === -1 || dsmlOpenIdx < toolOpenIdx)) {\n          const before = remaining.slice(0, dsmlOpenIdx);\n          if (before) {\n            results.push({ type: "text", content: before });\n            this.hasEmittedText = true;\n          }\n          const match = remaining.slice(dsmlOpenIdx).match(ChannelTokenRouter.DSML_OPEN_RE);\n          remaining = remaining.slice(dsmlOpenIdx + (match ? match[0].length : 1));\n          if (remaining.startsWith("\\n")) remaining = remaining.slice(1);\n          this.inDsmlTool = true;\n        }\n        // Priority 1: Tool Open\n        else if (toolOpenIdx !== -1 && (thinkOpenIdx === -1 || toolOpenIdx < thinkOpenIdx)) {\n')
          replace_once(sm,
              '    const type = this.inThinking ? "thinking" : this.inTool ? "tool" : "text";\n    return [{ type, content }];\n',
              '    if (this.inDsmlTool || /[|｜]DSML[|｜]/i.test(content)) return [];\n    const type = this.inThinking ? "thinking" : this.inTool ? "tool" : "text";\n    return [{ type, content }];\n')
          replace_once(sm,
              '      return { type: "thinking", data: stripServerPaths(reasoningDelta) };',
              '      return { type: "thinking", data: sanitizeText(stripServerPaths(reasoningDelta)) };')
          replace_once(sm,
              '      return { type: "thinking", data: stripServerPaths(String(data?.content ?? "")) };',
              '      return { type: "thinking", data: sanitizeText(stripServerPaths(String(data?.content ?? ""))) };')
          replace_once(sm,
              '      const reqPath = (reqArgs?.path ?? reqArgs?.filePath ?? reqArgs?.file ?? reqArgs?.target) as string | undefined;\n      return {',
              '      const reqPath = (reqArgs?.path ?? reqArgs?.filePath ?? reqArgs?.file ?? reqArgs?.target) as string | undefined;\n      const effectiveSuccess = inferToolSuccess(data?.result, data?.success);\n      return {')
          replace_once(sm,
              '          success: data?.success,\n          friendlyMessage: friendlyToolResult(resultToolName, data?.result, data?.success),',
              '          success: effectiveSuccess,\n          friendlyMessage: friendlyToolResult(resultToolName, data?.result, effectiveSuccess),')

          # 3) Tool progress callbacks must not force success=true.
          tc = 'services/api/src/routes/chat/tool-callbacks.ts'
          replace_once(tc,
              '  friendlyToolResult,\n} from "../../ai/tool-messages.js";',
              '  friendlyToolResult,\n  inferToolSuccess,\n} from "../../ai/tool-messages.js";')
          replace_once(tc,
              '      traceCollector?.onToolEnd(toolName, _args, result);\n      const friendly = friendlyToolResult(toolName, result, true);',
              '      traceCollector?.onToolEnd(toolName, _args, result);\n      const success = inferToolSuccess(result);\n      const friendly = friendlyToolResult(toolName, result, success);')
          replace_once(tc,
              '          success: true,\n          friendlyMessage: friendly,',
              '          success,\n          friendlyMessage: friendly,')

          # 4) Trace success must follow the tool result, not merely non-null.
          tf = 'services/api/src/ai/trace-factory.ts'
          replace_once(tf,
              'import { scrubSecrets } from "../tracing/secret-patterns.js";\n',
              'import { scrubSecrets } from "../tracing/secret-patterns.js";\nimport { inferToolSuccess } from "./tool-messages.js";\n')
          replace_once(tf,
              '    push("tool_end", { name, tool_key: matchedKey, duration_ms: dur, result, success: result !== null && result !== undefined });',
              '    push("tool_end", { name, tool_key: matchedKey, duration_ms: dur, result, success: inferToolSuccess(result) });')

          # 5) Batch file creation: validate the whole batch before writing any file.
          ct = 'services/api/src/ai/providers/copilot-tools.ts'
          edit_marker = '    defineTool("edit_file", {'
          batch_tool = '''    defineTool("create_files", {
              description: "Create or overwrite multiple project files in ONE call. Use this whenever a task needs 2+ new files. Batch 3-5 related files per call (maximum 8) instead of making one model turn per file. Every item needs relative `path` and full `content`. The entire batch is syntax-validated before any file is written.",
              parameters: {
                type: "object" as const,
                properties: {
                  files: {
                    type: "array" as const,
                    minItems: 1,
                    maxItems: 8,
                    items: {
                      type: "object" as const,
                      properties: {
                        path: { type: "string" as const, description: "Project-relative path, e.g. src/pages/Dashboard.tsx" },
                        content: { type: "string" as const, description: "Complete file contents" },
                      },
                      required: ["path", "content"] as const,
                    },
                  },
                },
                required: ["files"] as const,
              },
              handler: async (args: { files: Array<{ path: string; content: string }> }) => {
                if (!Array.isArray(args.files) || args.files.length < 1 || args.files.length > 8) {
                  return { success: false, error: "create_files requires 1-8 files." };
                }
                const frameworkId = await getProjectFramework(projectId);
                const guard = await getConfigGuard(projectId);
                const tanstack = detectTanStackStart(getProjectPath(projectId));
                const seen = new Set<string>();
                const prepared: Array<{ path: string; content: string; overwritten: boolean }> = [];

                for (const item of args.files) {
                  const filePath = normalizePath(projectId, item.path, frameworkId);
                  if (seen.has(filePath)) return { success: false, error: `Duplicate path in create_files batch: ${filePath}` };
                  seen.add(filePath);
                  if (guard.isLocked(filePath)) {
                    return { success: false, error: `Cannot create ${filePath} — server-side config files are locked by dovault for security.` };
                  }
                  if (tanstack) {
                    let currentContent: string | undefined;
                    try { currentContent = await readFile(projectId, filePath); } catch { /* new file */ }
                    const violation = tanStackHijackViolation(filePath, item.content, currentContent);
                    if (violation) return { success: false, error: violation };
                  }
                  const syntaxCheck = validateFileSyntax(filePath, item.content);
                  if (!syntaxCheck.ok) {
                    return {
                      success: false,
                      error: `Syntax error in ${filePath}: ${syntaxCheck.message}\\nNo files from this batch were written. Fix the syntax and retry create_files.`,
                    };
                  }
                  prepared.push({
                    path: filePath,
                    content: item.content,
                    overwritten: existsSync(path.join(getProjectPath(projectId), filePath)),
                  });
                }

                emitToolEvent(projectId, "create_files", "start", { count: prepared.length, paths: prepared.map((f) => f.path) });
                for (const file of prepared) await writeFile(projectId, file.path, file.content);
                emitToolEvent(projectId, "create_files", "end", { count: prepared.length, paths: prepared.map((f) => f.path) });
                return {
                  success: true,
                  count: prepared.length,
                  paths: prepared.map((f) => f.path),
                  files: prepared.map((f) => ({ path: f.path, overwritten: f.overwritten, size: Buffer.byteLength(f.content, "utf-8") })),
                  message: `Created/updated ${prepared.length} files in one batch`,
                };
              },
            }),

          '''
          replace_once(ct, edit_marker, batch_tool + edit_marker)

          # 6) Treat batch creation as a real write in watchdogs and DB guard.
          ce = 'services/api/src/ai/providers/copilot-engine.ts'
          replace_once(ce,
              '  "create_file", "edit_file", "write", "create", "str_replace_editor", "str_replace", "multi_edit",\n',
              '  "create_file", "create_files", "edit_file", "write", "create", "str_replace_editor", "str_replace", "multi_edit",\n')
          replace_once(ce, '  collect(a, 2);\n', '  collect(a, 3);\n')
          replace_once(ce,
              '    const TOOL_EXEC_TIMEOUT_MS = 600_000; // 10 min\n    let lastProgressTime = Date.now();',
              '    const TOOL_EXEC_TIMEOUT_MS = 600_000; // 10 min\n    // Absolute budget for MODEL LOOP time. A turn that keeps emitting events\n    // must still terminate instead of running forever. Active tools are exempt\n    // so long render/build operations are not killed mid-execution.\n    const TURN_TIMEOUT_MS = Math.max(60_000, Number(process.env.AI_TURN_MAX_MS) || 240_000);\n    const turnStartedAt = Date.now();\n    let lastProgressTime = turnStartedAt;')
          replace_once(ce,
              '        const since = Date.now() - lastProgressTime;\n        const timeout = activeToolCount > 0',
              '        const totalElapsed = Date.now() - turnStartedAt;\n        if (activeToolCount === 0 && totalElapsed > TURN_TIMEOUT_MS) {\n          const message = `AI turn exceeded ${Math.round(TURN_TIMEOUT_MS / 1000)}s total runtime and was stopped so the editor cannot hang indefinitely.`;\n          console.warn(`[CopilotEngine] hard turn timeout (${sid}…) elapsed=${totalElapsed}ms`);\n          try { onEvent?.({ type: "session.error", data: { message } } as SessionEvent); } catch {}\n          this.abortedSessions.add(sessionId);\n          void engine.abort().catch(() => {});\n          finish(new Error(message));\n          return;\n        }\n        const since = Date.now() - lastProgressTime;\n        const timeout = activeToolCount > 0')

          sr = 'services/api/src/routes/chat/stream-recovery.ts'
          replace_once(sr,
              'const FILE_WRITE_TOOLS = new Set(["create_file", "edit_file", "write_file", "create", "edit", "write"]);',
              'const FILE_WRITE_TOOLS = new Set(["create_file", "create_files", "edit_file", "write_file", "create", "edit", "write"]);')

          # 7) Tell models to batch related files instead of one expensive turn/file.
          sp = 'services/api/src/routes/chat/system-prompts.ts'
          intro = "  return `You are Doable's Agent Mode AI. You build complete, working web applications by creating files, editing files, and installing packages. The user sees a live preview that updates in real-time as you make changes.\\n\\n"
          perf = """  return `You are Doable's Agent Mode AI. You build complete, working web applications by creating files, editing files, and installing packages. The user sees a live preview that updates in real-time as you make changes.\n\n═══════════════════════════════════════════════════════════════\n  ⚡  FAST BUILD DISCIPLINE — REQUIRED  ⚡\n═══════════════════════════════════════════════════════════════\n- If you need to create 2 or more files, use `create_files`; do NOT create one file per model turn.\n- Batch 3-5 related files in each `create_files` call (maximum 8).\n- Generate the complete contents for the batch, call the tool once, then move immediately to the next batch.\n- If a batch fails syntax validation, fix only that batch and retry it.\n- Do not narrate between file writes and do not repeatedly re-read files you just created.\n- Aim to finish an ordinary multi-page app in 1-3 write-tool calls, then verify preview.\n═══════════════════════════════════════════════════════════════\n\n"""
          replace_once(sp, intro, perf)

          # Basic static sanity checks.
          for p in [tm, sm, tc, tf, ct, ce, sr, sp]:
              text = Path(p).read_text()
              if '\\x00' in text:
                  raise SystemExit(f'nul byte introduced in {p}')
          PY

          git diff --check
          git diff --stat
          grep -R "defineTool(\"create_files\"" -n services/api/src/ai/providers/copilot-tools.ts
          grep -R "TURN_TIMEOUT_MS" -n services/api/src/ai/providers/copilot-engine.ts
          grep -R "inferToolSuccess" -n services/api/src/ai/{tool-messages.ts,sse-mapper.ts,trace-factory.ts}

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "fekra-v2-bot"
          git config user.email "actions@users.noreply.github.com"
          git add services/api/src/ai/tool-messages.ts \
                  services/api/src/ai/sse-mapper.ts \
                  services/api/src/ai/trace-factory.ts \
                  services/api/src/ai/providers/copilot-tools.ts \
                  services/api/src/ai/providers/copilot-engine.ts \
                  services/api/src/routes/chat/tool-callbacks.ts \
                  services/api/src/routes/chat/stream-recovery.ts \
                  services/api/src/routes/chat/system-prompts.ts
          git commit -m "fix(agent): batch file writes and bound stalled turns"
          git push origin HEAD:fekra-v2-bootstrap
