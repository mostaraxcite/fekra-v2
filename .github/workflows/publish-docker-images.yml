# ==============================================================================
# Publish Fekra V2 / Doable Docker images
# ==============================================================================
# Durable images go to GHCR. Bootstrap branch builds also publish a copy to the
# isolated Railway smoke registry so runtime testing does not depend on GHCR
# package visibility or private-registry credentials.
# ==============================================================================

name: Publish Docker images

on:
  push:
    branches:
      - fekra-v2-bootstrap
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/doable
  SMOKE_PREFIX: smoke-registry-production.up.railway.app/fekra-v2

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [api, ws, web, migrate]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          IMAGE="${IMAGE_PREFIX}-${{ matrix.target }}"
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
            echo "tags=${IMAGE}:${VERSION},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
            echo "Building ${IMAGE}:${VERSION} (+ :latest)"
          else
            SMOKE_IMAGE="${SMOKE_PREFIX}-${{ matrix.target }}:latest"
            echo "tags=${IMAGE}:latest,${SMOKE_IMAGE}" >> "$GITHUB_OUTPUT"
            echo "Building ${IMAGE}:latest + ${SMOKE_IMAGE}"
          fi

      - name: Build and push ${{ matrix.target }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/docker/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # The isolated Railway PoC uses split public origins. Passing them as
          # build args lets Next.js compile the correct CSP allowlist for the
          # web image; runtime env rewriting still handles the client bundle.
          build-args: |
            NEXT_PUBLIC_APP_URL=https://web-production-bc2cf.up.railway.app
            NEXT_PUBLIC_API_URL=https://api-production-410d.up.railway.app
            NEXT_PUBLIC_WS_URL=wss://ws-v2-production.up.railway.app
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          provenance: false