name: Fix preview HMR path once

on:
  push:
    branches:
      - fekra-v2-bootstrap
    paths:
      - .github/workflows/fix-preview-hmr-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fekra-v2-bootstrap
      - name: Patch duplicated preview HMR path
        shell: bash
        run: |
          set -euo pipefail
          FILE="services/api/src/projects/vite-plugin-source-annotations.ts"
          OLD='const safePath = JSON.stringify(`/preview/${projectId}/__hmr`);'
          NEW='const safePath = JSON.stringify(`/__hmr`);'
          grep -F "$OLD" "$FILE"
          python - <<'PY'
          from pathlib import Path
          p = Path('services/api/src/projects/vite-plugin-source-annotations.ts')
          s = p.read_text()
          old = 'const safePath = JSON.stringify(`/preview/${projectId}/__hmr`);'
          new = 'const safePath = JSON.stringify(`/__hmr`);'
          if old not in s:
              raise SystemExit('expected HMR path not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          git diff -- "$FILE"
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "fekra-v2-bot"
          git config user.email "actions@users.noreply.github.com"
          git add services/api/src/projects/vite-plugin-source-annotations.ts
          git commit -m "fix(preview): avoid duplicated HMR proxy prefix"
          git push origin HEAD:fekra-v2-bootstrap
