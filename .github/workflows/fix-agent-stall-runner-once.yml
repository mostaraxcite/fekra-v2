name: Run agent stall hardening once

on:
  push:
    branches:
      - fekra-v2-bootstrap
    paths:
      - .github/workflows/fix-agent-stall-runner-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fekra-v2-bootstrap

      - name: Execute corrected hardening patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          src = Path('.github/workflows/fix-agent-stall-once.yml').read_text()
          start = src.index("          python - <<'PY'\n") + len("          python - <<'PY'\n")
          end = src.index("          PY\n", start)
          script = textwrap.dedent(src[start:end])
          old = 'intro = "  return `You are Doable\'s Agent Mode AI. You build complete, working web applications by creating files, editing files, and installing packages. The user sees a live preview that updates in real-time as you make changes.\\\\n\\\\n"'
          wanted = "  return `You are Doable's Agent Mode AI. You build complete, working web applications by creating files, editing files, and installing packages. The user sees a live preview that updates in real-time as you make changes." + chr(10) + chr(10)
          new = "intro = " + repr(wanted)
          if old not in script:
              raise SystemExit('could not patch system prompt matcher in embedded script')
          script = script.replace(old, new, 1)
          exec(compile(script, 'agent-hardening-patch.py', 'exec'), {'__name__': '__main__'})
          PY

          git diff --check
          git diff --stat
          grep -R 'defineTool("create_files"' -n services/api/src/ai/providers/copilot-tools.ts
          grep -R 'TURN_TIMEOUT_MS' -n services/api/src/ai/providers/copilot-engine.ts
          grep -R 'inferToolSuccess' -n services/api/src/ai/tool-messages.ts services/api/src/ai/sse-mapper.ts services/api/src/ai/trace-factory.ts

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "fekra-v2-bot"
          git config user.email "actions@users.noreply.github.com"
          git add services/api/src/ai/tool-messages.ts \
                  services/api/src/ai/sse-mapper.ts \
                  services/api/src/ai/trace-factory.ts \
                  services/api/src/ai/providers/copilot-tools.ts \
                  services/api/src/ai/providers/copilot-engine.ts \
                  services/api/src/routes/chat/tool-callbacks.ts \
                  services/api/src/routes/chat/stream-recovery.ts \
                  services/api/src/routes/chat/system-prompts.ts
          git commit -m "fix(agent): batch file writes and bound stalled turns"
          git push origin HEAD:fekra-v2-bootstrap
